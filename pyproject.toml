[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-weather-air-quality"
version = "0.3.0"
description = "Source-aware environmental data and analytics for Vietnam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "httpx>=0.28,<0.29",
]

[project.scripts]
vn-air = "vn_air.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vn_air.database" = ["migrations/*.py", "migrations/versions/*.py", "migrations/versions/*.sql"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
