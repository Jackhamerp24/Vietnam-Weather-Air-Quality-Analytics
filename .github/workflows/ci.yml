name: CI

# Credential-free offline and disposable-PostgreSQL gates only.
# No secrets, no scheduled ingestion, no uploads, no deployment, no
# pull_request_target. Actions are pinned to verified upstream commits
# (resolved 2026-09-12 UTC with:
#   git ls-remote https://github.com/actions/checkout refs/tags/v4
#   git ls-remote https://github.com/actions/setup-python refs/tags/v5
# for actions/checkout v4.4.0 and actions/setup-python v5.6.0).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install bounded project dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run offline suite
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -v

  isolated-postgres:
    name: Isolated PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install bounded project dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Add the newest PostgreSQL binaries to PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Run disposable socket-only PostgreSQL suite
        env:
          PYTHONPATH: src
        run: python -B scripts/test_database.py
